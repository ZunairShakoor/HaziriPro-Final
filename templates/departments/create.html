{% extends "layouts/base.html" %}

{% block title %}Add Department{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h3>Add Department</h3>
        </div>

        <div class="card-body">

            <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Department Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="e.g. Information Technology"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department Code</label>
                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        placeholder="e.g. IT"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter department description"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department Manager</label>

                    <select
                        name="manager_id"
                        class="form-select">

                        <option value="">
                            -- Select Manager --
                        </option>

                        {% for employee in employees %}

                        <option value="{{ employee.id }}">
                            {{ employee.full_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('departments.list') }}"
                       class="btn btn-secondary">

                        Back

                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Save Department

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
