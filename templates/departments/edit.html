{% extends "layouts/base.html" %}

{% block title %}Edit Department{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header">

<h3>Edit Department</h3>

</div>

<div class="card-body">

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
value="{{ department.name }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Department Code</label>

<input
type="text"
name="code"
value="{{ department.code }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
rows="4"
class="form-control">{{ department.description }}</textarea>

</div>

<div class="mb-3">

<label>Manager</label>

<select
name="manager_id"
class="form-select">

<option value="">Select Manager</option>

{% for employee in employees %}

<option
value="{{ employee.id }}"
{% if department.manager_id==employee.id %}selected{% endif %}>

{{ employee.full_name }}

</option>

{% endfor %}

</select>

</div>

<a
href="{{ url_for('departments.list') }}"
class="btn btn-secondary">

Cancel

</a>

<button
class="btn btn-success">

Update Department

</button>

</form>

</div>

</div>

</div>

{% endblock %}
