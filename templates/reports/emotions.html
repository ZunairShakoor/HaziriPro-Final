{% extends 'layouts/base.html' %}

{% block title %}Emotion Reports - HaziriPro{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-smile"></i> Emotion Analysis Reports</h1>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0">Generate Emotion Report</h5>
    </div>
    <div class="card-body">
        <p class="text-muted">Exports emotion detections captured during check-in/check-out for the selected date range.</p>
        <form method="POST" action="{{ url_for('reports.generate_emotions') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" required>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end_date" name="end_date" required>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="format" class="form-label">Format</label>
                        <select class="form-select" id="format" name="format" required>
                            <option value="pdf">PDF</option>
                            <option value="excel">Excel</option>
                            <option value="csv">CSV</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-download"></i> Generate Report
            </button>
        </form>
    </div>
</div>
{% endblock %}
