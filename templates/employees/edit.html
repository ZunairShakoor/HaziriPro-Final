{% extends "layouts/base.html" %}

{% block title %}Edit Employee{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header">

<h3>Edit Employee</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="row">

<div class="col-md-6 mb-3">

<label>First Name</label>

<input
type="text"
name="first_name"
class="form-control"
value="{{ employee.first_name }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Last Name</label>

<input
type="text"
name="last_name"
class="form-control"
value="{{ employee.last_name }}"
required>

</div>

<div class="col-md-6 mb-3">

<label>Date of Birth</label>

<input
type="date"
name="date_of_birth"
class="form-control"
value="{{ employee.date_of_birth }}">

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<select
name="gender"
class="form-select">

<option value="Male" {% if employee.gender=="Male" %}selected{% endif %}>Male</option>

<option value="Female" {% if employee.gender=="Female" %}selected{% endif %}>Female</option>

<option value="Other" {% if employee.gender=="Other" %}selected{% endif %}>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ employee.phone }}">

</div>

<div class="col-md-6 mb-3">

<label>Position</label>

<input
type="text"
name="position"
class="form-control"
value="{{ employee.position }}">

</div>

<div class="col-md-6 mb-3">

<label>Department</label>

<select
name="department_id"
class="form-select">

{% for department in departments %}

<option
value="{{ department.id }}"
{% if employee.department_id==department.id %}selected{% endif %}>

{{ department.name }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-6 mb-3">

<label>Employment Type</label>

<select
name="employment_type"
class="form-select">

<option value="Full-Time" {% if employee.employment_type=="Full-Time" %}selected{% endif %}>Full-Time</option>

<option value="Part-Time" {% if employee.employment_type=="Part-Time" %}selected{% endif %}>Part-Time</option>

<option value="Contract" {% if employee.employment_type=="Contract" %}selected{% endif %}>Contract</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Base Salary</label>

<input
type="number"
step="0.01"
name="base_salary"
class="form-control"
value="{{ employee.base_salary }}">

</div>

<div class="col-md-6 mb-3">

<label>Hourly Rate</label>

<input
type="number"
step="0.01"
name="hourly_rate"
class="form-control"
value="{{ employee.hourly_rate }}">

</div>

<div class="col-md-6 mb-3">

<label>Status</label>

<select
name="status"
class="form-select">

<option value="active" {% if employee.status=="active" %}selected{% endif %}>Active</option>

<option value="inactive" {% if employee.status=="inactive" %}selected{% endif %}>Inactive</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea
name="address"
class="form-control"
rows="3">{{ employee.address }}</textarea>

</div>

<div class="col-md-12 mb-3">

<label>Employee Photo</label>

<input
type="file"
name="photo"
class="form-control">

</div>

</div>

<a
href="{{ url_for('employees.profile', employee_id=employee.employee_id) }}"
class="btn btn-secondary">

Cancel

</a>

<button
type="submit"
class="btn btn-primary">

Update Employee

</button>

</form>

</div>

</div>

</div>

{% endblock %}
